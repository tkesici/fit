<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tevfik Kesici</title>
<meta name="description" content="Antrenman programı ve toplu hazırlanan yemek tarifleri.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="favicon.svg?v=11" type="image/svg+xml">
<style>
:root{
  --bg:#F2EDE3; --ink:#1D1B18; --muted:#776F62; --line:#D9D0BF; --soft:#E9E4D9;
  --tint:#ECE7DD; --hover:#E3DDD1; --eq:#8C8273;
  --g:#5F8A5E; --y:#C49A2A; --r:#B4553D; --sug:#93561C; --sug-bg:#E9DECA;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151411; --ink:#EBE4D6; --muted:#91887A; --line:#2F2C26; --soft:#211F1C;
    --tint:#1C1A18; --hover:#262420; --eq:#A69C8B;
    --g:#7FAE7C; --y:#D9B44E; --r:#D27760; --sug:#E2AA6C; --sug-bg:#2B241B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151411; --ink:#EBE4D6; --muted:#91887A; --line:#2F2C26; --soft:#211F1C;
  --tint:#1C1A18; --hover:#262420; --eq:#A69C8B;
  --g:#7FAE7C; --y:#D9B44E; --r:#D27760; --sug:#E2AA6C; --sug-bg:#2B241B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.page{max-width:760px;padding:11vh 4.5vw 14vh}
.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:56px;font-size:.92rem;color:var(--muted)}
.topline a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.topline a:hover{color:var(--ink);border-color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.langs{display:flex;align-items:center;height:36px;padding:3px;border:1px solid var(--line);border-radius:999px;transition:border-color .2s}
.langs:hover{border-color:var(--ink)}
.langs button{height:28px;min-width:34px;padding:0 9px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 .76rem var(--sans);letter-spacing:.08em;cursor:pointer;transition:background .2s,color .2s}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.themeb{display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s}
.themeb:hover{color:var(--ink);border-color:var(--ink)}
.themeb svg{width:17px;height:17px;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.themeb:hover svg{transform:rotate(-20deg)}
.themeb .sun{display:none} .themeb .moon{display:block}
.themeb.is-dark .sun{display:block} .themeb.is-dark .moon{display:none}
@media (prefers-reduced-motion:reduce){.themeb svg{transition:none}}
h1{font:400 clamp(3.2rem,8vw,5.6rem)/1 var(--serif);letter-spacing:-.025em;margin:0 0 44px}
.lede{max-width:34em;margin:0 0 40px;font-size:1.12rem}
.tabs{display:flex;gap:28px;margin:0 0 8px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:0 0 12px;cursor:pointer;color:var(--muted);font-size:1.02rem;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.sub{display:flex;gap:20px;margin:26px 0 0;font-size:.95rem}
.sub button{background:none;border:0;padding:0 0 3px;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent}
.sub button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.hint{color:var(--muted);font-size:.95rem;margin:22px 0 0}
section.blk{margin-top:52px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.blk-h h2{font:400 1.75rem/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.blk-h .meta{color:var(--muted);font-size:.92rem}
.list{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:18px;width:100%;padding:15px 4px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.row.meal{grid-template-columns:10px 1fr 18px}
.row:hover{background:var(--hover)}
.row.bf{background:var(--tint)}
.row.bf:hover{background:var(--hover)}
.rn{font:400 1.2rem/1.3 var(--serif)}
.rm{color:var(--muted);font-size:.9rem;white-space:nowrap}
.ra{color:var(--muted);font-size:.95rem;text-align:right}
.row:hover .ra{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.g{background:var(--g)} .dot.y{background:var(--y)} .dot.r{background:var(--r)}
@media (max-width:520px){
  body{font-size:16px}
  .page{padding:7vh 22px 10vh}
  .topline{margin-bottom:40px}
  .row{gap:4px 14px}
  .row:not(.meal){grid-template-columns:1fr 18px}
  .row:not(.meal) .rm{grid-column:1;grid-row:2}
  .row:not(.meal) .ra{grid-column:2;grid-row:1 / span 2}
}

/* dialog */
dialog.md{border:1px solid var(--line);padding:0;border-radius:6px;background:var(--bg);color:var(--ink);width:min(640px,94vw);max-height:88vh;overflow:hidden}
dialog.md::backdrop{background:rgba(20,18,15,.45)}
.md-in{display:flex;flex-direction:column;max-height:88vh}
.md-h{display:flex;align-items:flex-start;gap:16px;padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.md-h h2{flex:1;margin:0;font:400 1.8rem/1.15 var(--serif);letter-spacing:-.01em}
.md-x{flex:none;background:none;border:0;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 4px}
.md-x:hover{color:var(--ink)}
.md-b{overflow-y:auto;padding:18px 24px 26px}
.md-b h3{font:400 1.25rem/1.2 var(--serif);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.md-b p{margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.9rem;margin-bottom:16px}
.tags .ef{display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.mac{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mac div{padding:10px 4px;text-align:center;line-height:1.2}
.mac div+div{border-left:1px solid var(--line)}
.mac b{display:flex;align-items:center;justify-content:center;gap:6px;font:400 1.35rem var(--serif)}
.mac small{color:var(--muted);font-size:.75rem}
.mac .sug{background:var(--sug-bg)} .mac .sug b,.mac .sug small{color:var(--sug)}
.gi{width:9px;height:9px;border-radius:50%;display:inline-block}
.gi.low,.gi.lowmid{background:var(--g)} .gi.mid{background:var(--y)} .gi.high{background:var(--r)}
.por{display:inline-flex;align-items:center;gap:6px;font:400 .9rem var(--sans);color:var(--muted)}
.por button{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}
.por button:hover{border-color:var(--ink)}
.por b{min-width:76px;text-align:center;font-weight:500;color:var(--ink)}
.shop{list-style:none;margin:0;padding:0;columns:2 230px;column-gap:26px}
.shop li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.shop label{display:flex;gap:9px;align-items:baseline;cursor:pointer}
.shop input{accent-color:var(--ink)}
.shop input:checked+span{text-decoration:line-through;color:var(--muted)}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:8px}
.note{border-left:2px solid var(--sug);padding:4px 0 4px 12px;color:var(--muted);font-size:.95rem;margin-top:16px!important}
.figs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border:1px solid var(--line);border-radius:4px;padding:12px 10px 6px;margin-bottom:18px}
.figs figure{margin:0;text-align:center}
.figs svg{width:100%;max-width:190px;height:auto;display:block;margin:0 auto}
.figs figcaption{font-size:.8rem;color:var(--muted)}
.figs .arr{color:var(--muted);padding:0 6px}
.kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 16px}
.kv div{padding:10px 0}
.kv div+div{border-left:1px solid var(--line);padding-left:16px}
.kv dt{color:var(--muted);font-size:.8rem}
.kv dd{margin:0;font:400 1.3rem var(--serif)}
.alts{list-style:none;margin:0;padding:0}
.alts li{padding:8px 0;border-top:1px solid var(--line)}
.alts li:last-child{border-bottom:1px solid var(--line)}
@media (max-width:560px){
  dialog.md{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:10px 10px 0 0;max-height:92vh;border-width:1px 0 0}
  .md-in{max-height:92vh}
  .md-h{padding:18px 20px 12px}
  .md-b{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
  .mac b{font-size:1.15rem}
}

/* figure strokes */
.lm{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;fill:none}
.torso{stroke-width:4.2}
.far{opacity:.35}
.hd{fill:var(--bg);stroke:var(--ink);stroke-width:3}
.tp{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.eq,.hnd{fill:var(--eq)}
.mach{fill:var(--line)}
.ml{stroke:var(--line);stroke-width:4;stroke-linecap:round}
.mt{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.plate{stroke:var(--eq);stroke-width:4;stroke-linecap:round}
.cable{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 2}
.pul{fill:var(--bg);stroke:var(--muted);stroke-width:1.6}
.barl{stroke:var(--eq);stroke-width:3.4;stroke-linecap:round}
.floor{stroke:var(--line);stroke-width:1.5}
.ftxt{font:500 7px var(--sans);fill:var(--muted)}
</style>
</head>
<body>
<div class="page">
  <div class="topline">
    <a href="https://tevfikkesici.com">← tevfikkesici.com</a>
    <div class="tools">
      <div class="langs" id="langs" role="group"><button data-l="tr" lang="tr">TR</button><button data-l="en" lang="en">EN</button></div>
      <button class="themeb" id="themeb" type="button" aria-label="Temayı değiştir">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </button>
    </div>
  </div>
  <h1>Fit</h1>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-antrenman" aria-controls="antrenman">Antrenman</button>
    <button role="tab" id="t-beslenme" aria-controls="beslenme">Beslenme</button>
  </nav>

  <main>
    <section id="antrenman" role="tabpanel" aria-labelledby="t-antrenman">
      <div class="sub" id="progSeg"></div>
      <div id="workouts"></div>
    </section>
    <section id="beslenme" role="tabpanel" aria-labelledby="t-beslenme" hidden>
      <div id="slots"></div>
    </section>
  </main>
</div>
<dialog class="md" id="md"></dialog>

<script>
document.addEventListener('selectstart',e=>e.preventDefault());
/* ---------- figure drawing ---------- */
const L=(a,b,c='lm')=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${c}"/>`;
const db=at=>({t:'db',at}), hd=at=>({t:'h',at}), bar=at=>({t:'bar',at});
function prop(p){
  switch(p.t){
    case 'db': return `<circle cx="${p.at[0]}" cy="${p.at[1]}" r="4.6" class="eq"/>`;
    case 'h': return `<circle cx="${p.at[0]}" cy="${p.at[1]}" r="2.8" class="hnd"/>`;
    case 'bar': return `<circle cx="${p.at[0]}" cy="${p.at[1]}" r="7" class="eq"/>`;
    case 'roll': return `<circle cx="${p.at[0]}" cy="${p.at[1]}" r="4" class="mach"/>`;
    case 'rect': return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="1.5" class="mach"/>`;
    case 'ln': return L(p.a,p.b,p.c||'ml');
    case 'cable': return L(p.a,p.b,'cable');
    case 'pul': return `<circle cx="${p.at[0]}" cy="${p.at[1]}" r="3.2" class="pul"/>`;
    case 'barline': return L(p.a,p.b,'barl');
    case 'txt': return `<text x="${p.at[0]}" y="${p.at[1]}" class="ftxt">${p.s}</text>`;
  }
  return '';
}
function side(P){
  let o='';(P.bg||[]).forEach(x=>o+=prop(x));
  if(P.k2){o+=L(P.p,P.k2,'lm far')+L(P.k2,P.a2,'lm far');if(P.t2)o+=L(P.a2,P.t2,'lm far');}
  if(P.e2){o+=L(P.s,P.e2,'lm far')+L(P.e2,P.w2,'lm far');}
  o+=L(P.s,P.h)+L(P.s,P.p,'lm torso')+L(P.p,P.k)+L(P.k,P.a);
  const t=P.t===undefined?[P.a[0]+7,P.a[1]]:P.t; if(t)o+=L(P.a,t);
  o+=L(P.s,P.e)+L(P.e,P.w);
  o+=`<circle cx="${P.h[0]}" cy="${P.h[1]}" r="6" class="hd"/>`;
  (P.fg||[]).forEach(x=>o+=prop(x));
  return o;
}
function front(P){
  let o='';(P.bg||[]).forEach(x=>o+=prop(x));
  const n=[(P.sL[0]+P.sR[0])/2,(P.sL[1]+P.sR[1])/2];
  o+=L(n,P.h);
  o+=`<polygon points="${P.sL} ${P.sR} ${P.pR} ${P.pL}" class="tp"/>`;
  o+=L(P.pL,P.kL)+L(P.kL,P.aL)+L(P.aL,[P.aL[0]-6,P.aL[1]])+L(P.pR,P.kR)+L(P.kR,P.aR)+L(P.aR,[P.aR[0]+6,P.aR[1]]);
  o+=L(P.sL,P.eL)+L(P.eL,P.wL)+L(P.sR,P.eR)+L(P.eR,P.wR);
  o+=`<circle cx="${P.h[0]}" cy="${P.h[1]}" r="6" class="hd"/>`;
  (P.fg||[]).forEach(x=>o+=prop(x));
  return o;
}
function fig(view,P,label){
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${label}"><line x1="2" y1="111" x2="118" y2="111" class="floor"/>${view==='side'?side(P):front(P)}</svg>`;
}

const ST={h:[60,22],s:[60,33],p:[60,62],k:[60,86],a:[60,110],e:[61,48],w:[62,63]};
const FR={h:[60,20],sL:[48,32],sR:[72,32],pL:[53,62],pR:[67,62],kL:[52,86],kR:[68,86],aL:[50,110],aR:[70,110]};
const FS={h:[60,30],sL:[48,42],sR:[72,42],pL:[53,72],pR:[67,72],kL:[50,80],kR:[70,80],aL:[49,108],aR:[71,108]};

const LPbg=[{t:'ln',a:[12,63],b:[34,95]},{t:'ln',a:[36,98],b:[54,98]},{t:'ln',a:[44,98],b:[44,110],c:'mt'},{t:'ln',a:[58,108],b:[110,64],c:'mt'}];
const BBench=[{t:'rect',x:12,y:86,w:26,h:6},{t:'ln',a:[16,92],b:[16,110],c:'mt'},{t:'ln',a:[34,92],b:[34,110],c:'mt'}];
const FlatB=[{t:'rect',x:14,y:84,w:56,h:6},{t:'ln',a:[22,90],b:[22,110],c:'mt'},{t:'ln',a:[62,90],b:[62,110],c:'mt'}];
const IncB=[{t:'ln',a:[25,57],b:[48,93]},{t:'ln',a:[46,95],b:[68,95]},{t:'ln',a:[56,95],b:[56,110],c:'mt'}];
const CurlB=[{t:'rect',x:8,y:88,w:80,h:5},{t:'ln',a:[14,93],b:[14,110],c:'mt'},{t:'ln',a:[80,93],b:[80,110],c:'mt'}];
const RowB=[{t:'ln',a:[47,90],b:[75,63]},{t:'ln',a:[58,80],b:[58,110],c:'mt'}];
const SRowB=[{t:'ln',a:[24,97],b:[52,97]},{t:'ln',a:[38,97],b:[38,110],c:'mt'},{t:'ln',a:[81,86],b:[81,108]},{t:'pul',at:[108,90]}];
const tower=(x,py)=>[{t:'ln',a:[x,6],b:[x,110],c:'mt'},{t:'pul',at:[x-2,py]}];

const POSES={
  goblet:{v:'side',
    s:{...ST,e:[64,49],w:[69,38],fg:[db([71,38])]},
    e:{h:[61,51],s:[57,62],p:[47,90],k:[69,90],a:[60,110],e:[62,77],w:[67,66],fg:[db([69,66])]}},
  legpress:{v:'side',
    s:{h:[14,60],s:[20,68],p:[40,92],k:[54,72],a:[72,80],t:[69,73],e:[26,83],w:[38,90],bg:[...LPbg,{t:'ln',a:[69,66],b:[79,92],c:'plate'}]},
    e:{h:[14,60],s:[20,68],p:[40,92],k:[64,80],a:[88,70],t:[85,63],e:[26,83],w:[38,90],bg:[...LPbg,{t:'ln',a:[85,56],b:[97,82],c:'plate'}]}},
  rdl:{v:'side',
    s:{...ST,fg:[db([62,66])]},
    e:{h:[90,52],s:[79,55],p:[50,64],k:[57,87],a:[60,110],e:[79,70],w:[79,85],fg:[db([79,88])]}},
  bulgarian:{v:'side',
    s:{h:[62,22],s:[62,33],p:[62,63],k:[70,86],a:[72,110],k2:[52,84],a2:[32,84],t2:[25,86],e:[62,48],w:[62,62],bg:BBench,fg:[db([62,65])]},
    e:{h:[61,42],s:[60,53],p:[56,82],k:[78,88],a:[72,110],k2:[46,104],a2:[32,84],t2:[25,86],e:[63,68],w:[64,83],bg:BBench,fg:[db([64,86])]}},
  hipthrust:{v:'side',
    s:{h:[21,64],s:[28,72],p:[50,98],k:[72,84],a:[76,110],e:[38,88],w:[48,94],bg:[{t:'rect',x:4,y:73,w:24,h:37}],fg:[bar([50,92])]},
    e:{h:[17,66],s:[28,72],p:[56,74],k:[76,82],a:[78,110],e:[42,80],w:[54,72],bg:[{t:'rect',x:4,y:73,w:24,h:37}],fg:[bar([56,67])]}},
  legcurl:{v:'side',
    s:{h:[12,81],s:[22,83],p:[52,83],k:[76,83],a:[98,83],t:[99,90],e:[20,95],w:[12,100],bg:CurlB,fg:[{t:'roll',at:[98,77]}]},
    e:{h:[12,81],s:[22,83],p:[52,83],k:[76,83],a:[84,62],t:[91,63],e:[20,95],w:[12,100],bg:CurlB,fg:[{t:'roll',at:[79,58]}]}},
  dbbench:{v:'side',
    s:{h:[18,77],s:[28,80],p:[58,80],k:[80,80],a:[84,110],e:[38,92],w:[34,76],bg:FlatB,fg:[db([34,73])]},
    e:{h:[18,77],s:[28,80],p:[58,80],k:[80,80],a:[84,110],e:[29,64],w:[30,48],bg:FlatB,fg:[db([30,45])]}},
  incline:{v:'side',
    s:{h:[30,53],s:[36,62],p:[56,88],k:[78,86],a:[82,110],e:[34,78],w:[40,64],bg:IncB,fg:[db([41,61])]},

  'tavuk göğsü':'chicken breast','salatalık':['cucumber','cucumbers'],'kekik, tuz, karabiber':'oregano, salt, black pepper','antrikot':'ribeye steak','tereyağı':'butter','taze biberiye':'fresh rosemary','mantar':'mushrooms','yeşil salata':'green salad','iri tuz, karabiber':'coarse salt, black pepper',
  'patlıcan':['eggplant','eggplants'],'kıyma':'ground beef','sivri biber':['green pepper','green peppers'],'karabuğday':'buckwheat','taze zencefil':'fresh ginger','soya sosu':'soy sauce','tam buğday makarna':'whole wheat pasta','beyaz peynir':'white cheese (feta-style)','çeri domates':'cherry tomatoes','kekik, tuz':'oregano, salt','kekik, karabiber, tuz':'oregano, black pepper, salt',
  'tavuk (göğüs ve but karışık)':'chicken (breast and thigh)','pul biber, tuz':'chili flakes, salt','lor peyniri':'curd cheese (lor)','rendelenmiş kaşar':'grated kashar cheese','ıspanak':'spinach','taze soğan':'green onion','çavdar ekmeği':'rye bread','tam buğday lavaş':['whole wheat wrap','whole wheat wraps'],'marul':['lettuce','lettuces'],'pul biber, kekik, kimyon':'chili flakes, oregano, cumin',
  'az yağlı süzme yoğurt':'low-fat strained yogurt','ceviz':'walnuts','tarçın':'cinnamon','elma':['apple','apples'],'tam buğday ekmeği':'whole wheat bread','sade kefir':'plain kefir','çiğ badem':'raw almonds','saf yer fıstığı ezmesi':'pure peanut butter','muz':['banana','bananas'],'ayran':'ayran','humus':'hummus','haşlanmış yumurta':['boiled egg','boiled eggs'],
  'şekersiz kakao':'unsweetened cocoa','chia tohumu':'chia seeds','dondurulmuş çilek':'frozen strawberries','tam tahıllı ekmek':'whole grain bread','maydanoz, pul biber':'parsley, chili flakes','iri yulaf':'old-fashioned oats','yarım yağlı süt':'semi-skimmed milk','yaban mersini (dondurulmuş olur)':'blueberries (frozen is fine)','kaşar':'kashar cheese','avokado':['avocado','avocados'],'zeytin':['olive','olives']
};
const UNIT_EN={yk:['tbsp','tbsp'],tk:['tsp','tsp'],'diş':['clove','cloves'],dilim:['slice','slices'],demet:['bunch','bunches'],dal:['stalk','stalks'],'parça':['piece','pieces'],kase:['bowl','bowls']};

let lang=store.get('fit-lang','');
if(lang!=='tr'&&lang!=='en')lang=(navigator.language||'tr').toLowerCase().startsWith('tr')?'tr':'en';
const T=()=>UI[lang];
const en=()=>lang==='en';
const tx=s=>en()?s.replace(/her bacak/g,'per leg').replace(/her taraf/g,'per side').replace(/ sn\b/g,' s').replace(/ dk\b/g,' min').replace('(ileri seviye)','(advanced)'):s;
const mName=id=>en()?MEALS_EN[id].n:MEALS[id].n;
const progName=s=>en()?(PROG_EN[s]||s):s;

/* ---------- theme ---------- */
const root=document.documentElement, themeb=document.getElementById('themeb');
function isDark(){const t=root.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintThemeBtn(){const d=isDark();themeb.classList.toggle('is-dark',d);themeb.setAttribute('aria-label',d?T().toLight:T().toDark);themeb.title=d?T().light:T().dark;}
const savedTheme=store.get('fit-theme','');
if(savedTheme)root.dataset.theme=savedTheme;
themeb.onclick=()=>{const next=isDark()?'light':'dark';root.dataset.theme=next;store.set('fit-theme',next);paintThemeBtn();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintThemeBtn);

/* ---------- training ---------- */
let prog=store.get('fit-prog','p4'); if(!PROGRAMS[prog])prog='p4';
function renderTraining(){
  document.getElementById('progSeg').innerHTML=Object.entries(PROGRAMS).map(([k,v])=>`<button data-p="${k}" aria-pressed="${k===prog}">${progName(v.label)}</button>`).join('');
  document.querySelectorAll('#progSeg button').forEach(b=>b.onclick=()=>{prog=b.dataset.p;store.set('fit-prog',prog);renderTraining();});
  document.getElementById('workouts').innerHTML=PROGRAMS[prog].days.map((day,di)=>`
    <section class="blk">
      <div class="blk-h"><h2>${progName(day.t)}</h2><span class="meta">${tx(day.d)}</span></div>
      <div class="list">${day.x.map(([id,dose],xi)=>`
        <button class="row" data-d="${di}" data-x="${xi}"><span class="rn">${EX[id].n}</span><span class="rm">${tx(dose)}</span><span class="ra" aria-hidden="true">›</span></button>`).join('')}
      </div>
    </section>`).join('');
  document.querySelectorAll('#workouts .row').forEach(b=>b.onclick=()=>openExercise(...PROGRAMS[prog].days[b.dataset.d].x[b.dataset.x]));
}
function openExercise(id,dose,rest){
  const e=EX[id],p=POSES[id],U=T();
  const f=(pose,lab)=>{const s=fig(p.v,pose,e.n+' '+lab);return en()?s.replace('kablo yanda','cable at side'):s;};
  openDialog(e.n,`
    <div class="figs">
      <figure>${f(p.s,U.start)}<figcaption>${U.start}</figcaption></figure>
      <span class="arr" aria-hidden="true">→</span>
      <figure>${f(p.e,U.end)}<figcaption>${U.end}</figcaption></figure>
    </div>
    <dl class="kv"><div><dt>${U.sets}</dt><dd>${tx(dose)}</dd></div><div><dt>${U.rest}</dt><dd>${tx(rest)}</dd></div></dl>
    <p>${en()?EX_EN[id]:e.c}</p>
    <h3>${U.alts}</h3>
    <ul class="alts">${e.alt.map(a=>`<li>${tx(a)}</li>`).join('')}</ul>`);
}

/* ---------- nutrition ---------- */
function renderNutrition(){
  const U=T();
  document.getElementById('slots').innerHTML=SLOTS.map((s,si)=>`
    <section class="blk">
      <div class="blk-h"><h2>${U.slots[si]}</h2></div>
      <div class="list">${s.o.map(id=>{const e=eff(id);return `
        <button class="row meal${id[0]==='b'?' bf':''}" data-id="${id}"><span class="dot ${e}" title="${U.eff[e]}" aria-label="${U.eff[e]}"></span><span class="rn">${mName(id)}</span><span class="ra" aria-hidden="true">›</span></button>`}).join('')}
      </div>
    </section>`).join('');
  document.querySelectorAll('#slots .row').forEach(b=>b.onclick=()=>openMeal(b.dataset.id));
}
function ingLine(q,u,n,por,base){
  if(!en()){
    if(q==null)return n;
    let v=q*por/base;
    if(u==='g'||u==='ml'){v=v>=100?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);return `${v} ${u} ${n}`;}
    v=Math.round(v*2)/2; if(v<0.5)v=0.5;
    const s=v===0.5?'yarım':String(v).replace('.',',');
    return `${u?`${s} ${u}`:s} ${n}`;
  }
  const e=ING_EN[n]||n, nm=Array.isArray(e)?e:[e,e];
  if(q==null)return nm[0];
  let v=q*por/base;
  if(u==='g'||u==='ml'){v=v>=100?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);return `${v} ${u} ${nm[0]}`;}
  v=Math.round(v*2)/2; if(v<0.5)v=0.5;
  const s=v===0.5?'½':String(v), pl=v>1;
  if(u){const un=UNIT_EN[u]||[u,u];return `${s} ${pl?un[1]:un[0]} ${nm[0]}`;}
  return `${s} ${pl?nm[1]:nm[0]}`;
}
function openMeal(id){
  const m=MEALS[id],E=MEALS_EN[id],e=eff(id),U=T(),L=en();
  let por=m.base;
  const keep=L?E.keep:m.keep, note=L?E.note:m.note, steps=L?E.steps:m.steps;
  const tags=[id[0]==='b'?U.bf:'',L?METHOD_EN[m.m]:m.m,m.go?U.go:'',keep||''].filter(Boolean);
  openDialog(mName(id),`
    <div class="tags"><span class="ef"><span class="dot ${e}"></span>${U.eff[e]}, ${U.prep(EFF[id])}</span>${tags.map(t=>`<span>${t}</span>`).join('')}</div>
    <div class="mac">
      <div><b>${kcal(m)}</b><small>kcal</small></div>
      <div><b>${m.c}<span class="gi ${m.g}" title="${U.gi[m.g]}" aria-label="${U.gi[m.g]}"></span></b><small>${U.c}</small></div>
      <div><b>${m.p}</b><small>${U.p}</small></div>
      <div><b>${m.f}</b><small>${U.f}</small></div>
      <div class="sug"><b>${m.s}</b><small>${U.s}</small></div>
    </div>
    <h3>${U.shop} <span class="por"><button data-d="-1" aria-label="${U.less}">−</button><b id="porv"></b><button data-d="1" aria-label="${U.more}">+</button></span></h3>
    <ul class="shop" id="shop"></ul>
    <h3>${U.recipe}</h3>
    <ol class="steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    ${note?`<p class="note">${note}</p>`:''}`);
  const draw=()=>{
    document.getElementById('porv').textContent=U.por(por);
    document.getElementById('shop').innerHTML=m.ing.map(([q,u,n])=>`<li><label><input type="checkbox"><span>${ingLine(q,u,n,por,m.base)}</span></label></li>`).join('');
  };
  draw();
  dlg.querySelectorAll('.por button').forEach(b=>b.onclick=()=>{por=Math.min(8,Math.max(1,por+Number(b.dataset.d)));draw();});
}

/* ---------- language ---------- */
function applyLang(){
  const U=T();
  root.lang=lang;
  document.getElementById('t-antrenman').textContent=U.tabT;
  document.getElementById('t-beslenme').textContent=U.tabN;
  const g=document.getElementById('langs');
  g.setAttribute('aria-label',U.langs);
  g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  if(dlg.open)dlg.close();
  renderTraining();renderNutrition();paintThemeBtn();
}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{if(b.dataset.l===lang)return;lang=b.dataset.l;store.set('fit-lang',lang);applyLang();});

/* ---------- tabs ---------- */
function show(name){
  if(name!=='antrenman'&&name!=='beslenme')name='antrenman';
  ['antrenman','beslenme'].forEach(n=>{document.getElementById(n).hidden=n!==name;document.getElementById('t-'+n).setAttribute('aria-selected',String(n===name));});
}
document.getElementById('t-antrenman').onclick=()=>{location.hash='antrenman'};
document.getElementById('t-beslenme').onclick=()=>{location.hash='beslenme'};
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
applyLang();show(location.hash.slice(1));
</script>
</body>
